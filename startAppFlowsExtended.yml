---
- name: Run startAppFlows.py and show log
  hosts: all
  gather_facts: no

  vars:
    app_dir: C:\trade_report_UA_backup\tradeReportExtended\startAppFlows
    venv_python: C:\trade_report_UA_backup\tradeReportExtended\startAppFlows\venv\Scripts\python.exe

  tasks:
    - name: Ensure startAppFlows directory exists
      win_file:
        path: "{{ app_dir }}"
        state: directory

    - name: Run startAppFlows.py
      win_shell: |
        & "{{ venv_python }}" "{{ app_dir }}\\startAppFlows.py"
      environment:
        AWS_ACCESS_KEY: "{{ lookup('env', 'AWS_ACCESS_KEY') }}"
        AWS_SECRET_KEY: "{{ lookup('env', 'AWS_SECRET_KEY') }}"
      register: start_output
      ignore_errors: yes

    - name: Show startAppFlows.py stdout
      debug:
        var: start_output.stdout_lines

    - name: Show startAppFlows.py stderr
      debug:
        var: start_output.stderr_lines
