- hosts: all
  gather_facts: yes
  vars:
    ansible_become_user: "{{ username }}"
    ansible_become_pass: "{{ password }}"

  tasks:
    - name: Check if DymocksLoyaltyUpgrade folder exists
      win_shell: |
        $folder = "C:\ARFILES\DymocksLoyaltyUpgrade"
        $hostname = $env:COMPUTERNAME
        $ipAddress = (Get-NetIPAddress -AddressFamily IPv4 |
          Where-Object {$_.InterfaceAlias -notmatch "Loopback"} |
          Select-Object -First 1).IPAddress

        if (Test-Path -Path $folder -PathType Container) {
          Write-Output "✅ SUCCESS: DymocksLoyaltyUpgrade Folder Exists on $hostname (IP: $ipAddress)"
        } else {
          Write-Output "❌ ERROR: DymocksLoyaltyUpgrade Folder Not Found in C:\ARFILES on $hostname (IP: $ipAddress). Please create or copy the folder."
        }
      register: DymocksLoyaltyUpgrade_folder_status
      ignore_errors: yes
      changed_when: false

    - name: Show folder existence status
      ansible.builtin.debug:
        var: DymocksLoyaltyUpgrade_folder_status.stdout
      when: DymocksLoyaltyUpgrade_folder_status.stdout is defined

  become: yes
  become_method: runas
  become_flags: logon_type=new_credentials logon_flags=netcredentials_only
