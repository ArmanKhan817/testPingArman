- hosts: all
  gather_facts: yes

  vars:
    ansible_become_user: '{{ username }}'
    ansible_become_pass: '{{ password }}'

  become: yes
  become_method: runas
  become_flags: logon_type=new_credentials logon_flags=netcredentials_only

  tasks:

    - name: Stop POS process safely
      ansible.windows.win_shell: |
        if (Get-Process -Name "POS" -ErrorAction SilentlyContinue) {
          Stop-Process -Name "POS" -Force
          Write-Output "POS was running and has been stopped"
        }
        else {
          Write-Output "POS is not running"
        }

    - name: Show result
      ansible.builtin.debug:
        msg: "POS check/stop completed successfully"
